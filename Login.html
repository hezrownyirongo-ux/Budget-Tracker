<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Budget Tracker</title>
<link rel="stylesheet" href="Budget Tracker.css .css"> 

</head>
<body>
<header>
  <div class="brand">
    <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="budget.html#budgets">Budgets</a>
    <a href="expenses.html#add-expense">Add Expense</a>
    <a href="Login.html">Login</a>
  </nav>
</header>
<main>
<!-- LOGIN -->
<section class="view" id="login">
  <h1>Login</h1>
  <div class="card" style="max-width:420px"><form action="dashboard.html">
    <label for="le">Email</label><input id="le" type="email" placeholder="you@example.com">
    <label for="lp">Password</label><input id="lp" type="password">
    <a class="btn" href="dashboard.html">Login</a>
    <p class="hint">No account? <a href="#register">Register here</a></p>
  </form></div>
</section>

<!-- REGISTER -->
<section class="view" id="register">
  <h1>Register</h1>
  <div class="card" style="max-width:420px"><form action="Login.html">
    <label for="rn">Full name</label><input id="rn" type="text">
    <label for="re">Email</label><input id="re" type="email">
    <label for="rp">Password</label><input id="rp" type="password">
    <label for="rc">Confirm password</label><input id="rc" type="password">
    <a class="btn" href="#login">Create Account</a>
    <p class="hint">Already registered? <a href="Login.html">Login</a></p>
  </form></div>
</section>

</main>
<footer>&copy; 2026 Smart Budget Tracker – Web Programming Group Project (HTML and CSS prototype with dummy data)</footer>
</body>
</html>
